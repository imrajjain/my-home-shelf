# Publishes the public Shelf website (apps/web) to Azure Static Web Apps
# (free plan) whenever it changes on the main branch.
name: Website

on:
  push:
    branches: [claude/personal-interest-index-fff7ud]
    paths: ["apps/web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/web
          skip_app_build: true
          skip_api_build: true
